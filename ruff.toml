target-version = "py39"
line-length = 100
extend-exclude = ["lib", "build", "descargas"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "BLE"]
ignore = [
  "E501",    # el largo de línea lo resuelve el formateador
]

[lint.per-file-ignores]
"pruebas/**" = ["S101"]
"tests/**" = ["S101"]

[format]
quote-style = "double"
